<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Вариант 1 — frfoc.by — дизайн сайта</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px -apple-system,sans-serif;background:#e9e8e4}
nav{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:#1f1e1d}
nav a{color:#fff;text-decoration:none;margin-right:10px;font-weight:600}nav button{border:0;border-radius:8px;padding:7px 12px;background:#3a3937;color:#eee;cursor:pointer;font-size:13px}

<body><nav><a href="../">← Все варианты</a><b style="color:#aaa;margin-right:10px">Вариант 1</b><button data-src="pages/01.html" data-w="1440" data-key="home">Главная — компьютер</button><button data-src="pages/02.html" data-w="390" data-key="home">Главная — телефон</button><button data-src="pages/03.html" data-w="390" data-key="schedule">Расписание — телефон</button><button data-src="pages/04.html" data-w="1440" data-key="catalog">Каталог услуг</button><button data-src="pages/05.html" data-w="1440" data-key="service">Услуга — Обучение плаванию</button><button data-src="pages/06.html" data-w="1440" data-key="schedule">Расписание</button><button data-src="pages/07.html" data-w="1440" data-key="prices">Цены</button><button data-src="pages/08.html" data-w="1440" data-key="object">Объект — Артемида</button><button data-src="pages/09.html" data-w="1440" data-key="booking">Запись и результаты</button></nav><div id="wrap"><iframe id="f"></iframe></div>
<script>const f=document.getElementById('f'),bs=[...document.querySelectorAll('nav button')];
function go(b){bs.forEach(x=>x.classList.toggle('on',x===b));f.src=b.dataset.src;const w=+b.dataset.w;f.style.maxWidth=w<800?w+'px':'100%';location.hash=bs.indexOf(b)+1}
bs.forEach(b=>b.onclick=()=>go(b));go(bs[(+location.hash.slice(1)||1)-1]||bs[0]);window.addEventListener('message',function(e){var k=e.data&&e.data.frfocGo;if(!k)return;var cur=bs.find(b=>b.classList.contains('on'));var ph=cur&&+cur.dataset.w<800;var c=bs.filter(b=>b.dataset.key===k);var b=c.find(b=>(+b.dataset.w<800)===ph)||c.find(b=>+b.dataset.w>=800)||c[0];if(b){go(b);window.scrollTo(0,0)}});</script></body></html>
